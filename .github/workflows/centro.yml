# Centro di controllo sempre acceso (SOLDI FINTI): ogni mezz'ora GitHub rifà i conti dell'arena con i prezzi
# pubblici di Kraken e pubblica la pagina con GitHub Pages. Non usa chiavi né conti di trading.
#
# Come resta acceso: finito il giro, questo lavoro lancia «pausa» (pausa.yml), che aspetta mezz'ora e poi
# rilancia questo lavoro. Serve perché l'orario di GitHub (schedule) su questo repository non è mai partito
# (problema di GitHub segnalato da molti nel 2026). L'orario resta come riserva: se GitHub un giorno lo fa
# partire, ogni 3 ore riaccende la catena nel caso si sia fermata.
name: centro-di-controllo
run-name: ${{ github.event_name == 'schedule' && 'giro programmato' || github.actor == 'github-actions[bot]' && 'giro della catena' || 'giro a mano' }}
on:
  schedule:
    - cron: "17 */3 * * *"     # riserva (vedi sopra)
  workflow_dispatch: {}         # «Run workflow»: un giro subito (lo usa anche la pausa)
permissions:
  contents: write               # salva le candele nuove nel repository
  pages: write
  id-token: write
  actions: write                # lancia la pausa di mezz'ora
concurrency:
  group: centro
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pagina.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Conti dell'arena con i prezzi di Kraken
        run: python -B centro/esporta.py sito
      - name: Salva le candele nuove (servono per la storia oraria oltre i 30 giorni)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add centro/dati
          if git diff --cached --quiet; then echo "Nessuna candela nuova"; exit 0; fi
          git commit -q -m "Candele $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep 10
          done
          echo "::warning::Candele non salvate: si recuperano al prossimo giro"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: pagina
        uses: actions/deploy-pages@v4
        continue-on-error: true       # a volte GitHub non trova il pacchetto appena caricato: si riprova
      - if: steps.pagina.outcome == 'failure'
        run: sleep 30
      - id: pagina2
        if: steps.pagina.outcome == 'failure'
        uses: actions/deploy-pages@v4

  prossimo:
    needs: aggiorna
    if: ${{ !cancelled() }}     # anche se il giro è andato male (es. Kraken giù): la catena non si ferma
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lancia la pausa di mezz'ora (poi la pausa rilancia questo lavoro)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # se una pausa sta già aspettando, la catena è viva: non ne serve un'altra
          in_attesa=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pausa.yml --limit 20 --json status \
            --jq '[.[] | select(.status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested")] | length' || echo 0)
          if [ "${in_attesa:-0}" -gt 0 ]; then echo "Una pausa sta già aspettando: la catena è viva"; exit 0; fi
          for i in $(seq 1 10); do
            prima=$(date -u -d '-10 seconds' +%Y-%m-%dT%H:%M:%SZ)
            if gh workflow run pausa.yml -R "$GITHUB_REPOSITORY" --ref main; then
              # durante i guasti GitHub a volte accetta la richiesta e poi non crea il lavoro: controlla che ci sia
              for j in 1 2 3 4 5 6; do
                sleep 10
                nate=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pausa.yml --limit 5 --json createdAt \
                  --jq "[.[] | select(.createdAt >= \"$prima\")] | length" || echo 0)
                if [ "${nate:-0}" -gt 0 ]; then echo "Pausa lanciata"; exit 0; fi
              done
              echo "GitHub ha accettato la richiesta ma la pausa non è comparsa: riprovo"
            fi
            sleep 60
          done
          echo "::error::Pausa non lanciata: la catena si ferma. Si riaccende con Run workflow su centro-di-controllo."
          exit 1
